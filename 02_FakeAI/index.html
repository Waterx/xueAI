<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSE · 伪 AI 流式回答</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101820;
      color: #e5edf3;
      font: 16px/1.7 system-ui, sans-serif;
    }

    main {
      max-width: 1000px;
      margin: 48px auto;
      padding: 0 24px;
    }

    p, small {
      color: #a9bac8;
    }

    textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid #30414f;
      border-radius: 12px;
      background: #081017;
      color: inherit;
      font: inherit;
      resize: vertical;
    }

    button {
      margin: 12px 8px 12px 0;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button[type="submit"] {
      background: #78e0b0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    pre {
      height: 380px;
      overflow-y: auto;
      padding: 18px;
      border: 1px solid #30414f;
      border-radius: 12px;
      background: #081017;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 14px/1.8 monospace;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <small>02 / POST 问题 → 模型流 → SSE → 实时追加</small>
    <h1>伪 AI，也能流式回答</h1>
    <p>无需 API Key。用固定模板模拟模型逐段生成；输入 /error 可体验错误处理。</p>

    <form id="chat-form">
      <label for="prompt">你的问题</label>
      <textarea id="prompt" rows="3" maxlength="2000" required>请解释一下 SSE 为什么适合 AI 流式回答？</textarea>

      <button id="send" type="submit">发送问题</button>
      <button id="stop" type="button" disabled>停止生成</button>
      <span id="status" role="status">等待提问</span>
    </form>

    <div class="grid">
      <section>
        <h2>回答</h2>
        <pre id="answer" aria-label="模型回答"></pre>
      </section>

      <section>
        <h2>SSE 事件日志</h2>
        <pre id="log" role="log" aria-label="事件日志"></pre>
      </section>
    </div>

    <p>本例一次提问对应一次流，不保存对话历史，也不自动重连重试。</p>
  </main>

  <script>
    const form = document.querySelector('#chat-form');
    const prompt = document.querySelector('#prompt');
    const send = document.querySelector('#send');
    const stop = document.querySelector('#stop');
    const status = document.querySelector('#status');
    const answer = document.querySelector('#answer');
    const log = document.querySelector('#log');

    let controller = null;

    function handleEvent(block) {
      let name = 'message';
      const data = [];

      for (const line of block.split('\n')) {
        if (line.startsWith(':')) continue;

        const colon = line.indexOf(':');
        const field = colon === -1 ? line : line.slice(0, colon);
        const value = colon === -1 ? '' : line.slice(colon + 1).replace(/^ /, '');

        if (field === 'event') name = value;
        if (field === 'data') data.push(value);
      }

      if (!data.length) return null;

      const payload = JSON.parse(data.join('\n'));
      console.log(name, payload);
      log.textContent += block + '\n\n';
      log.scrollTop = log.scrollHeight;

      if (name === 'start') {
        status.textContent = '正在生成…';
      } else if (name === 'delta') {
        answer.textContent += payload.text;
        answer.scrollTop = answer.scrollHeight;
      } else if (name === 'done') {
        status.textContent = '回答完成';
      } else if (name === 'error') {
        throw new Error(payload.message);
      }

      return name;
    }

    async function readSSE(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      try {
        while (true) {
          const { value, done } = await reader.read();
          buffer += done ? decoder.decode() : decoder.decode(value, { stream: true });

          // 网络块不等于事件；本后端统一用 LF，按空行提取完整事件。
          let boundary;
          while ((boundary = buffer.indexOf('\n\n')) !== -1) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);

            if (handleEvent(block) === 'done') return;
          }

          if (done) throw new Error('连接提前结束，未收到 done 事件');
        }
      } finally {
        await reader.cancel();
        reader.releaseLock();
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const question = prompt.value.trim();
      if (!question || controller) return;

      controller = new AbortController();
      send.disabled = true;
      stop.disabled = false;
      answer.textContent = '';
      log.textContent = '';
      status.textContent = '正在连接…';

      try {
        // fetch 支持 POST 请求体；SSE 响应由上面的读取器解析。
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: question }),
          signal: controller.signal,
        });

        if (!response.ok) throw new Error(`请求失败：HTTP ${response.status}`);
        if (!response.headers.get('content-type')?.includes('text/event-stream')) {
          throw new Error('服务器未返回 SSE 响应');
        }

        await readSSE(response);
      } catch (error) {
        status.textContent = error.name === 'AbortError'
          ? '已停止生成'
          : `错误：${error.message}`;
      } finally {
        controller = null;
        send.disabled = false;
        stop.disabled = true;
      }
    });

    stop.addEventListener('click', () => {
      controller?.abort();
    });

    window.addEventListener('beforeunload', () => {
      controller?.abort();
    });
  </script>
</body>
</html>
